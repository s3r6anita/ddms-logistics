[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "site-dss"
version = "0.3.0"
requires-python = ">=3.12,<3.14"
dependencies = ["pydantic>=2,<3", "numpy", "scipy", "pandas", "statsmodels", "shapely", "pyproj", "rdflib", "owlrl", "psycopg[binary]", "pulp[cbc]>=4.2,<5", "streamlit", "networkx", "matplotlib", "plotly"]
[project.optional-dependencies]
test = ["pytest"]
[project.scripts]
site-dss = "site_dss.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
